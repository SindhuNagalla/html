<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <button onclick="play()">play</button>
        <button onclick="pause()">pause</button>

        <audio controls loop muted id="audio">
            <source src="[iSongs.info] 02 - Fear Song.mp3" type="audio/mp3">

        </audio>
    <script>
        var myaudio=document.getElementById("audio");
        function play()
        {
            if(myaudio.pause)
            myaudio.play();
        }
        function pause()
        {
            if(myaudio.play)
            myaudio.pause();
        }
    </script>
</body>
</html>
